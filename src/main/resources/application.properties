# ══════════════════════════════════════
# OneBody — Spring Boot Configuration
# ══════════════════════════════════════

spring.application.name=church-platform

# ── Database (Railway will override these) ──
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/church_platform}
spring.datasource.username=${DATABASE_USERNAME:churchapp}
spring.datasource.password=${DATABASE_PASSWORD:church@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA Settings ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── Server ──
server.port=${PORT:8080}

# ── JWT ──
app.jwt.secret=${JWT_SECRET:ChurchPlatformSuperSecretKey2024OneBody!@#}
app.jwt.expiration=86400000

# ── Cloudinary ──
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ── File Upload ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── CORS (Allow Angular frontend) ──
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID:your_google_client_id}